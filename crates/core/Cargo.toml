[package]
name = "wisper-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Platform-independent logic for Wisper: pipeline, providers, prompts, history, dictionary."

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
anyhow.workspace = true
tokio = { workspace = true, features = ["net", "io-util"] }
tracing.workspace = true
chrono.workspace = true
uuid.workspace = true
async-trait.workspace = true
reqwest = { version = "0.13", default-features = false, features = ["json", "multipart", "rustls", "stream"] }
rusqlite = { version = "0.38", features = ["bundled"] }
regex = "1"
flacenc = "0.5"
hound = "3.5"
strsim = "0.11"
base64 = "0.22"
claxon = "0.4"
sha2 = "0.10"
# Live transcription (OpenAI Realtime WebSocket). TLS is done with rustls + the OS certificate
# store, the same stack reqwest uses, so nothing new is compiled for it.
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
rustls-platform-verifier = "0.7"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
tempfile = "3"
wiremock = "0.6.5"
