name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test -- --passWithNoTests
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: core-linux
      - run: cargo test -p wisper-core --locked
      - name: Cleanup quality tests against the real Claude API (only when API keys are set)
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ]; then
            cargo test -p wisper-core --locked --test golden -- --ignored --nocapture
          else
            echo "No ANTHROPIC_API_KEY secret yet; skipping real-API quality tests."
          fi
      - name: Quick path (skip the AI for tiny dictations) matches the real AI cleanup (only when API keys are set)
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ]; then
            cargo test -p wisper-core --locked --test quick_eval -- --ignored --nocapture
          else
            echo "No ANTHROPIC_API_KEY secret yet; skipping the quick-path comparison."
          fi

      - name: Cleanup speed and quality by model
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GOLDEN_MODELS: claude-sonnet-5-5,claude-haiku-5-5
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ]; then
            cargo test -p wisper-core --locked --test golden -- --ignored --nocapture
          else
            echo "No ANTHROPIC_API_KEY secret yet; skipping model comparison."
          fi

  cloud-test:
    name: Cloud Worker tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloud
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cloud/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  cloud-deploy:
    name: Deploy cloud Worker
    needs: cloud-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      url: ${{ steps.url.outputs.url }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
    defaults:
      run:
        working-directory: cloud
        shell: bash
    steps:
      # Secrets cannot be used in `if:` directly, so check them here and gate the other steps.
      - name: Check Cloudflare secrets
        id: gate
        working-directory: .
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID are not set; skipping the cloud deploy (accounts will be unavailable in this build)."
          fi
      - uses: actions/checkout@v4
        if: steps.gate.outputs.enabled == 'true'
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.enabled == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cloud/package-lock.json
      - name: Install
        if: steps.gate.outputs.enabled == 'true'
        run: npm ci
      - name: Apply database migrations
        if: steps.gate.outputs.enabled == 'true'
        run: npx wrangler d1 migrations apply wisper --remote
      - name: Deploy Worker
        id: deploy
        if: steps.gate.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          if [ -n "$GOOGLE_CLIENT_ID" ]; then
            npx wrangler deploy --var "GOOGLE_CLIENT_ID:$GOOGLE_CLIENT_ID" 2>&1 | tee "$RUNNER_TEMP/deploy.log"
          else
            echo "::warning::GOOGLE_CLIENT_ID secret is not set; deploying with the placeholder id (Google sign-in will not work)."
            npx wrangler deploy 2>&1 | tee "$RUNNER_TEMP/deploy.log"
          fi
      - name: Create secrets that are missing (never regenerates existing ones)
        if: steps.gate.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          # If listing fails we stop. We must never guess "missing": regenerating MASTER_KEY
          # would make every stored API key unreadable.
          LIST="$(npx wrangler secret list --format json)"
          echo "$LIST" | jq -e 'type == "array"' > /dev/null
          has_secret() { echo "$LIST" | jq -e --arg n "$1" 'any(.[]; .name == $n)' > /dev/null; }

          for NAME in MASTER_KEY TOKEN_SECRET; do
            if has_secret "$NAME"; then
              echo "$NAME already exists; leaving it alone."
            else
              echo "Creating $NAME (value is never printed)."
              openssl rand -base64 32 | npx wrangler secret put "$NAME" > /dev/null
            fi
          done

          if [ -n "$GOOGLE_CLIENT_SECRET" ]; then
            printf '%s' "$GOOGLE_CLIENT_SECRET" | npx wrangler secret put GOOGLE_CLIENT_SECRET > /dev/null
            echo "GOOGLE_CLIENT_SECRET updated."
          else
            echo "::warning::GOOGLE_CLIENT_SECRET secret is not set; Google sign-in will not work."
          fi
      - name: Find the Worker URL
        id: url
        if: steps.gate.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          URL="$(grep -oE 'https://wisper-api\.[A-Za-z0-9-]+\.workers\.dev' "$RUNNER_TEMP/deploy.log" | head -n 1 || true)"
          if [ -z "$URL" ]; then
            # Fall back to asking Cloudflare for the account's workers.dev subdomain.
            SUB="$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" \
              | jq -r '.result.subdomain // empty')"
            if [ -n "$SUB" ]; then URL="https://wisper-api.$SUB.workers.dev"; fi
          fi
          if [ -z "$URL" ]; then
            echo "::error::Deployed, but could not work out the Worker URL."
            exit 1
          fi
          echo "Worker URL: $URL"
          echo "url=$URL" >> "$GITHUB_OUTPUT"

  windows:
    name: Windows installer
    # The cloud jobs may be skipped (pull requests, or no Cloudflare secrets yet): that must not
    # stop the release. A failed cloud test or a failed cloud deploy does stop it.
    needs: [test, cloud-test, cloud-deploy]
    if: >-
      always() && needs.test.result == 'success' && needs.cloud-test.result == 'success' &&
      (needs.cloud-deploy.result == 'success' || needs.cloud-deploy.result == 'skipped')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: app-windows
      - name: Set version
        shell: bash
        run: |
          VERSION="0.1.${{ github.run_number }}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          node scripts/set-version.mjs "$VERSION"
      - name: Windows tests
        run: cargo test -p wisper-core --locked
      - name: Build installer
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
          # Set only if the Worker was deployed in this run (or a repo variable names one).
          CLOUD_URL: ${{ needs.cloud-deploy.outputs.url || vars.WISPER_CLOUD_URL }}
        run: |
          if [ -n "$CLOUD_URL" ]; then
            export WISPER_CLOUD_URL="$CLOUD_URL"
            echo "Building with accounts enabled: $WISPER_CLOUD_URL"
          else
            echo "::notice::No cloud URL available; building without account support."
          fi
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            npx tauri build
          else
            echo "::warning::TAURI_SIGNING_PRIVATE_KEY secret is not set; building without auto-update support"
            npx tauri build --config src-tauri/tauri.no-updater.conf.json
          fi
      - name: Collect installer
        shell: bash
        run: node scripts/collect-release.mjs "$VERSION" "${{ github.repository }}"
      - uses: actions/upload-artifact@v4
        with:
          name: Wisper-${{ env.VERSION }}-installer
          path: release/
          retention-days: 14
      - name: Publish GitHub release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" release/* \
            --title "Wisper $VERSION" \
            --target "${{ github.sha }}" \
            --generate-notes \
            --latest
